name: AuraMaxxing
options:
  bundleIdPrefix: com.hugonoppe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  AuraMaxxing:
    type: application
    platform: iOS
    sources:
      - path: AuraMaxxing
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: AuraMaxxing/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hugonoppe.auramaxxing
        TARGETED_DEVICE_FAMILY: "1"           # iPhone uniquement
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App Group partagé avec le widget (compte Apple Developer requis).
        CODE_SIGN_ENTITLEMENTS: AuraMaxxing/Resources/AuraMaxxing.entitlements
        # DEVELOPMENT_TEAM: XXXXXXXXXX        # ← ton Team ID, ou signature automatique dans Xcode
      configs:
        Debug:
          AURA_API_URL: "http://localhost:3000"
        Release:
          AURA_API_URL: "https://api.auramaxxing.app"   # ← l'URL de ton backend déployé
    dependencies:
      - package: PostHog
      - target: AuraWidgetExtension

  # Widget écran d'accueil / écran verrouillé : rang dans la ligue, série, fin de saison.
  AuraWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AuraWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hugonoppe.auramaxxing.widget
        INFOPLIST_FILE: AuraWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AuraWidget/AuraWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
